<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acces Curs AI - Creare Video cu AI</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Dacă sesiunea e deja deblocată, intră direct în cursul AI
        (function() {
            const CHEIE_SECRETA = "AICURS2025";
            function hash(str) {
                let h = 0;
                for (let i = 0; i < str.length; i++) {
                    h = ((h << 5) - h) + str.charCodeAt(i);
                    h |= 0;
                }
                return h.toString();
            }
            if (sessionStorage.getItem("acces_ai") === hash(CHEIE_SECRETA)) {
                window.location.href = "ai.html";
            }
        })();
    </script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <h1>🤖 Curs AI Video</h1>
            <p class="subtitle">Introdu cheia de acces pentru a continua</p>
            <input type="password" id="cheie" placeholder="Introdu cheia de acces..." autocomplete="off">
            <button onclick="verificaCheieAI()">Deblochează Cursul AI</button>
            <p id="eroare" class="eroare"></p>
        </div>
        <p style="text-align:center;margin-top:18px;">
            <a href="ai-landing.html" style="color:var(--text-dim);font-size:14px;text-decoration:none;">← Înapoi la prezentarea cursului AI</a>
        </p>
    </div>

    <script>
        const CHEIE_SECRETA = "AICURS2025";

        function hash(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h |= 0;
            }
            return h.toString();
        }

        function verificaCheieAI() {
            const input = document.getElementById("cheie").value.trim();
            const eroare = document.getElementById("eroare");

            if (!input) {
                eroare.textContent = "⚠️ Te rog introdu o cheie!";
                return;
            }

            if (input === CHEIE_SECRETA) {
                sessionStorage.setItem("acces_ai", hash(CHEIE_SECRETA));
                window.location.href = "ai.html";
            } else {
                eroare.textContent = "❌ Cheie incorectă! Încearcă din nou.";
                document.getElementById("cheie").value = "";
                document.querySelector(".login-box").classList.add("shake");
                setTimeout(() => document.querySelector(".login-box").classList.remove("shake"), 500);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("cheie");
            if (input) {
                input.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") verificaCheieAI();
                });
            }
        });
    </script>
</body>
</html>
